name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-devel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out devel
        uses: actions/checkout@v4
        with:
          ref: devel
          fetch-depth: 0

      - name: Merge upstream devel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Kotatsu-Redo/Kotatsu-Redo.git
          git fetch upstream devel
          git merge --no-edit upstream/devel
          git push origin devel
