name: Build signed release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KOTATSU_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kotatsu.jks"

      - name: Build signed APK
        env:
          KOTATSU_KEYSTORE_PATH: ${{ runner.temp }}/kotatsu.jks
          KOTATSU_KEYSTORE_PASSWORD: ${{ secrets.KOTATSU_KEYSTORE_PASSWORD }}
          KOTATSU_KEY_ALIAS: ${{ secrets.KOTATSU_KEY_ALIAS }}
          KOTATSU_KEY_PASSWORD: ${{ secrets.KOTATSU_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare APK
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          test -n "$apk"
          cp "$apk" "Kotatsu-$TAG.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Kotatsu $TAG" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$TAG" "Kotatsu-$TAG.apk" --clobber
